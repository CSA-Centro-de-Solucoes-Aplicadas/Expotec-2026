# Uso:
#   docker compose up -d --build     -> gera a imagem e sobe o site em http://localhost:8080
#   docker compose push              -> envia a imagem para o Docker Hub (precisa de "docker login")
#
# Troque o usuário do Docker Hub com a variável DOCKERHUB_USER (ou num arquivo .env).
# Precisa ser o nome no Docker Hub (só minúsculas e números), não o da organização no GitHub:
#   DOCKERHUB_USER=meuusuario docker compose build
#
# A imagem também é gerada e enviada automaticamente pelo GitHub Actions (.github/workflows/docker.yml).
services:
  site:
    image: ${DOCKERHUB_USER:-csaifrn}/expotec-2026:${TAG:-latest}
    build:
      context: ./frontend
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    labels:
      # Só os containers com esta etiqueta são atualizados pelo Watchtower
      - com.centurylinklabs.watchtower.enable=true

  # Confere o Docker Hub de tempos em tempos e, se houver imagem nova do site,
  # baixa e reinicia o container sozinho. Fork mantido do Watchtower original (arquivado).
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true" # não mexe nos outros containers do servidor
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_INTERVALO:-7200} # segundos entre as checagens (7200 = 2 horas)
      WATCHTOWER_CLEANUP: "true" # apaga a imagem antiga depois de atualizar
      TZ: America/Fortaleza
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Se o repositório no Docker Hub for privado, faça "docker login" no servidor e descomente:
      # - ~/.docker/config.json:/config.json:ro
