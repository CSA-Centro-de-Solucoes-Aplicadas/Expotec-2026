# Gera a imagem do site e envia para o Docker Hub a cada push na main
# (inclusive os commits feitos pelo painel /admin).
#
# Configure no GitHub (Settings → Secrets and variables → Actions):
#   Secrets:
#     DOCKERHUB_USERNAME  usuário do Docker Hub que faz o push
#     DOCKERHUB_TOKEN     token de acesso (Docker Hub → Account settings → Personal access tokens, permissão Read & Write)
#   Variables (opcional):
#     DOCKERHUB_NAMESPACE organização do Docker Hub onde fica a imagem; se vazio, usa DOCKERHUB_USERNAME
name: Docker

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/expotec-2026
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
